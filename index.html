<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>CineVault — Discover films, TV and anime</title>
    <meta
      name="description"
      content="Browse films, television and anime, build a watchlist, and pick up where you left off. Metadata by TMDB and Kitsu."
    />
    <link rel="canonical" href="https://cinevault.example.com/" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CineVault" />
    <meta property="og:title" content="CineVault — Discover films, TV and anime" />
    <meta
      property="og:description"
      content="Browse films, television and anime, build a watchlist, and pick up where you left off."
    />
    <meta property="og:url" content="https://cinevault.example.com/" />
    <meta property="og:image" content="https://cinevault.example.com/logo-vault.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CineVault — Discover films, TV and anime" />
    <meta
      name="twitter:description"
      content="Browse films, television and anime, build a watchlist, and pick up where you left off."
    />
    <meta name="twitter:image" content="https://cinevault.example.com/logo-vault.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-vault.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      /* Applies the persisted theme before first paint to avoid a flash.
       *
       * The light/dark mode is read from its own key (cv:themeMode) which
       * store.tsx writes alongside cv:theme. Deriving mode from a hardcoded
       * list of theme ids here would duplicate that list and drift from it.
       * Keys must match src/lib/storage.ts. */
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('cv:theme') || localStorage.getItem('cv_theme') || 'crimson-premiere';
          var mode = localStorage.getItem('cv:themeMode') === 'light' ? 'light' : 'dark';
          var font = localStorage.getItem('cv:font') || localStorage.getItem('cv_font') || 'bricolage';
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-font', font);
          root.classList.remove('light', 'dark');
          root.classList.add(mode);
          root.style.colorScheme = mode;
        } catch (e) {
          /* Private-mode browsers throw on localStorage access. Defaults apply. */
        }
      })();
    </script>

    <!-- Only the default UI + display face load up front. The other display
         faces are fetched on demand by src/lib/fonts.ts when a user picks
         them, instead of shipping 12 families to everyone. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@600;700;800&display=swap"
    />
  </head>
  <body
    class="bg-background text-foreground font-sans antialiased overflow-x-hidden selection:bg-brand/30 selection:text-brand"
  >
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="bg-noise" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>JavaScript is required</h1>
        <p>CineVault needs JavaScript enabled to browse the catalogue.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
