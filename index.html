<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>CineVault — Discover films, TV and anime</title>
    <meta
      name="description"
      content="Browse films, television and anime, build a watchlist, and pick up where you left off. Metadata by TMDB and Kitsu."
    />
    <meta name="keywords" content="movies, tv shows, anime, streaming, watchlist, cinema, trailers, tmdb, kitsu, film tracker" />
    <meta name="author" content="CineVault" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://cinevault.app/" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CineVault" />
    <meta property="og:title" content="CineVault — Discover films, TV and anime" />
    <meta
      property="og:description"
      content="Browse films, television and anime, build a personalized watchlist, and pick up where you left off."
    />
    <meta property="og:url" content="https://cinevault.app/" />
    <meta property="og:image" content="https://cinevault.app/logo-vault.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="CineVault Cinema and Streaming Logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CineVault — Discover films, TV and anime" />
    <meta
      name="twitter:description"
      content="Browse films, television and anime, build a personalized watchlist, and pick up where you left off."
    />
    <meta name="twitter:image" content="https://cinevault.app/logo-vault.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-vault.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Schema.org JSON-LD Structured Data for Search Engines & LLMs -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://cinevault.app/#website",
            "url": "https://cinevault.app/",
            "name": "CineVault",
            "description": "Discover and stream films, TV series, and anime with a personalized watchlist.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://cinevault.app/#search/{search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "@id": "https://cinevault.app/#organization",
            "name": "CineVault",
            "url": "https://cinevault.app/",
            "logo": "https://cinevault.app/logo-vault.png",
            "description": "A cinema discovery and streaming platform for movies, TV shows, and anime enthusiasts."
          }
        ]
      }
    </script>

    <script>
      /* Applies the persisted theme before first paint to avoid a flash. */
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('cv:theme') || localStorage.getItem('cv_theme') || 'crimson-premiere';
          var mode = localStorage.getItem('cv:themeMode') === 'light' ? 'light' : 'dark';
          var font = localStorage.getItem('cv:font') || localStorage.getItem('cv_font') || 'bricolage';
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-font', font);
          root.classList.remove('light', 'dark');
          root.classList.add(mode);
          root.style.colorScheme = mode;
        } catch (e) {
          /* Private-mode browsers throw on localStorage access. Defaults apply. */
        }
      })();
    </script>

    <!-- Preconnect for performance -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  </head>
  <body
    class="bg-background text-foreground font-sans antialiased overflow-x-hidden selection:bg-brand/30 selection:text-brand"
  >
    <a href="#app-container" class="skip-link">Skip to main content</a>
    <div class="bg-noise" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>JavaScript is required</h1>
        <p>CineVault needs JavaScript enabled to browse the catalogue.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
